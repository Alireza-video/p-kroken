<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>På Kroken – Elegantti Meriravintola</title>

    <link rel="icon" href="favicon10.png" type="image/png">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700;700i&family=Inter:wght@300;400;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            /* LUXURY & HANKO PALETTI */
            --primary-dark: #051937; /* Midnight Blue */
            --primary-light: #F7F7F7; /* Marine White (tausta) */
            --accent-gold: #D4BE9B; /* Hanko Sand */
            --text-dark: #222222;
            --white: #fff;
            --secondary-dark: #1A375A; /* Tummempi kuin primary-dark */

            --font-logo: "Cormorant Garamond", serif;
            --font-body: "Inter", sans-serif;
        }

        /* Yleiset ja Resetoinnit */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background-color: var(--primary-light);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Linkit */
        a {
            text-decoration: none;
            color: var(--accent-gold);
            transition: color 0.3s;
        }
        a:hover {
            color: var(--primary-dark);
        }

        /* HEADER */
        header.main-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            background-color: transparent;
            z-index: 1000;
            transition: background-color 0.3s, box-shadow 0.3s, padding 0.3s;
        }

        header.main-header.scrolled {
            background-color: rgba(255, 255, 255, 0.98);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            padding: 1rem 5%;
        }

        .luxury-logo {
            font-family: var(--font-logo);
            font-size: 2.8rem;
            color: var(--primary-dark);
            font-weight: 700;
            font-style: italic;
            margin: 0;
        }

        .lang-selector {
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            color: var(--text-dark);
            font-weight: 700;
        }

        .lang-selector a {
            color: var(--primary-dark);
            padding: 0 0.3rem;
        }

        .lang-selector a.active {
            color: var(--accent-gold);
            text-decoration: underline;
        }

        /* Yleiset osiotyylit */
        section {
            width: 100%;
            padding: 10rem 5%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .page-section {
            opacity: 0;
            transform: translateY(80px);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }
        .page-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            font-family: var(--font-logo);
            color: var(--primary-dark);
            font-size: 3.5rem;
            margin-bottom: 3rem;
            font-weight: 700;
            position: relative;
        }
        /* Otsikko alaviiva */
        h2::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background-color: var(--accent-gold);
            margin: 10px auto 0;
        }


        /* HOME (Hero) */
        #home {
            padding-top: 15rem;
            background: linear-gradient(180deg, var(--primary-light) 0%, #EFEFEF 100%);
        }

        #home h1.logo {
            font-size: clamp(5rem, 12vw, 10rem);
            font-family: var(--font-logo);
            color: var(--accent-gold);
            font-style: italic;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .description {
            font-size: 1.5rem;
            font-weight: 300;
            max-width: 900px;
            margin: 1rem auto 4rem;
            color: var(--text-dark);
        }

        .contact-info {
            margin-bottom: 5rem;
            font-size: 1.3rem;
            line-height: 2;
        }
        .contact-info strong {
            color: var(--primary-dark);
        }


        /* === VARAA PÖYTÄ NYT -NAPPI (Hero) === */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(212, 190, 155, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(212, 190, 155, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 190, 155, 0); }
        }

        .reserve-button {
            /* Perustyyli */
            border: 3px solid var(--accent-gold);
            background-color: var(--accent-gold);
            color: var(--primary-dark);
            padding: 1.2em 5em;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            cursor: pointer;

            /* Animaatio */
            animation: pulse-gold 2s infinite;
        }

        .reserve-button:hover {
            background-color: var(--primary-dark);
            color: var(--accent-gold);
            transform: scale(1.08);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            animation: none;
        }


        /* MENU */
        #menu {
            background-color: var(--white);
            border-top: 1px solid #eee;
        }

        .menu-list {
            max-width: 850px;
            width: 100%;
        }

        .menu-list h3 {
            color: var(--primary-dark);
            margin-top: 3.5rem;
            padding-bottom: 0.8rem;
            font-size: 1.8rem;
            letter-spacing: 1px;
            font-family: var(--font-logo);
            font-weight: 700;
            text-align: left;
        }

        .menu-item {
            padding: 1.5rem 0;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.1);
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            text-align: left;
            cursor: pointer;
        }
        .menu-item:hover {
            background-color: rgba(212, 190, 155, 0.1);
            padding-left: 1rem;
            padding-right: 1rem;
            margin: 0 -1rem;
            transition: all 0.3s ease;
        }

        .menu-item-price {
            font-weight: 700;
            color: var(--accent-gold);
            white-space: nowrap;
            font-family: var(--font-logo);
        }

        /* GALLERY (PÄIVITETTY KUVILLE) */
        #gallery {
            background-color: var(--primary-light);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            max-width: 1000px;
            width: 100%;
            gap: 2.5rem;
        }
        .gallery-item {
            padding: 0; /* Poistettu vanha padding */
            background-color: transparent;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
            overflow: hidden;
        }
        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        /* KUVA-ELEMENTTIEN TYYLIT */
        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease-in-out;
        }

        .gallery-item:hover .gallery-img {
             transform: scale(1.05);
        }


        /* === BOOKING -OSIO (Vaalea teema) === */
        #booking {
            background-color: var(--primary-light);
            color: var(--text-dark);
            padding: 12rem 5%;
            min-height: 80vh;
        }
        #booking h2 {
            color: var(--primary-dark);
            font-size: 4rem;
            margin-bottom: 4rem;
        }
        /* Otsikko alaviiva vaalealle taustalle */
        #booking h2::after {
            background-color: var(--accent-gold);
        }

        .booking-details {
            background-color: var(--white);
            border: 1px solid rgba(212, 190, 155, 0.5);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.1);
            padding: 4rem 3rem;
            max-width: 700px;
            width: 100%;
        }

        .booking-details p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }

        .phone-link {
            font-size: 2.5rem;
            color: var(--accent-gold);
            font-family: var(--font-logo);
            font-weight: 700;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 4rem;
            transition: color 0.3s;
        }
        .phone-link:hover {
            color: var(--primary-dark);
        }

        /* AUKIOLOAJAT LISTA */
        .hours-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            text-align: left;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }
        .hours-grid p {
            margin: 0;
            line-height: 1.5;
            color: var(--text-dark);
            font-weight: 400;
        }
        .hours-grid strong {
            color: var(--primary-dark);
            font-weight: 700;
            display: inline-block;
            width: 50px;
        }


        /* MOBIILIOPTIMOINTI */
        @media (max-width: 768px) {
            header.main-header {
                padding: 1rem 3%;
            }
            .luxury-logo {
                font-size: 2rem;
            }
            section {
                padding: 8rem 3%;
                min-height: auto;
            }
            h2 {
                font-size: 2.5rem;
                margin-bottom: 2rem;
            }
            .description {
                font-size: 1.2rem;
                margin-bottom: 3rem;
            }
            .menu-item {
                font-size: 1.1rem;
            }
            .contact-info {
                font-size: 1.1rem;
                line-height: 1.8;
                margin-bottom: 4rem;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            /* BOOKING MOBIILI */
            #booking {
                padding: 8rem 3%;
                min-height: auto;
            }
            #booking h2 {
                font-size: 3rem;
            }
            .booking-details {
                padding: 3rem 1.5rem;
            }
            .phone-link {
                font-size: 1.8rem;
                margin-bottom: 3rem;
            }
            .hours-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hours-grid strong {
                 width: auto;
            }
            /* Varaa nappi mobiilissa */
            .reserve-button {
                padding: 1.2em 3em;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <header class="main-header" id="main-header">
        <h1 class="luxury-logo">På Kroken</h1>
        <div class="lang-selector">
            <a href="#" data-lang="fi" class="active">FI</a> /
            <a href="#" data-lang="sv">SV</a>
        </div>
    </header>

    <main id="content-container">
        </main>

    <footer class="footer">
        <p>&copy; 2025 På Kroken. Kaikki oikeudet pidätetään.</p>
    </footer>

    <script>
        // Kielen sisällöt
        const content = {
            fi: {
                home_h1: "På Kroken",
                home_desc: "Tuoreimmat merenelävät, valmistettu intohimolla. Tule nauttimaan modernista meriruoasta elegantissa, mutta rennossa ympäristössä Hangon sataman kupeessa.",
                home_address: "Tiilitehtaantie 12, 10900 Hanko",
                home_hours: "Ma–Pe 09–17, La 09–23",
                home_hours_full: "Ma: 09–17, Ti: 09–17, Ke: 09–17, To: 09–17, Pe: 09–17, La: 09–23, Su: Suljettu",
                home_button: "VARAA PÖYDÄN NYT",

                menu_h2: "Menu",
                menu_h3_1: "Alkuun",
                menu_item_1_name: "Käsin kuorittuja katkarapuja",
                menu_item_2_name: "Kermainen simpukkakeitto",
                menu_h3_2: "Pääruoat",
                menu_item_3_name: "Päivän tuore kala",
                menu_item_4_name: "Grillattu merilohi, varhaisperunat ja sesongin kasvikset",
                menu_item_5_name: "Merellinen risotto (simpukoita, jättikatkarapuja, sahrami)",
                menu_h3_3: "Jälkiruoat",
                menu_item_6_name: "Perinteinen Crème brûlée",

                gallery_h2: "Tunnelmia ravintolasta",
                gallery_item_1: "Keittoannos", // Päivitetyt ALT-tekstit
                gallery_item_2: "Hangon satama",
                gallery_item_3: "Pääruoka 1",
                gallery_item_4: "Pääruoka 2",

                booking_h2: "Varaa Pöytäsi",
                booking_p1: "Saat nopeimman vastauksen ja parhaimmat paikat Hangon aurinkoon soittamalla suoraan ravintolaamme. Tervetuloa nauttimaan elämyksestä!",
                booking_p2_strong: "Osoite",
                booking_p2_text: "Tiilitehtaantie 12, 10900 Hanko",
                booking_p3_strong: "Aukioloajat",
            },
            sv: {
                home_h1: "På Kroken",
                home_desc: "De färskaste skaldjuren, tillagade med passion. Kom och njut av modern havmat i en elegant men avslappnad miljö intill Hangö hamn.",
                home_address: "Tegelbruksvägen 12, 10900 Hangö",
                home_hours: "Må–Fr 09–17, Lö 09–23",
                home_hours_full: "Må: 09–17, Ti: 09–17, On: 09–17, To: 09–17, Fr: 09–17, Lö: 09–23, Sö: Stängt",
                home_button: "BOKA BORD NU",

                menu_h2: "Meny",
                menu_h3_1: "Förrätter",
                menu_item_1_name: "Handskalade räkor",
                menu_item_2_name: "Krämig musselsås",
                menu_h3_2: "Huvudrätter",
                menu_item_3_name: "Dagens färska fisk",
                menu_item_4_name: "Grillad havslax, färskpotatis och säsongens grönsaker",
                menu_item_5_name: "Maritim risotto (musslor, jätteräkor, saffran)",
                menu_h3_3: "Efterrätter",
                menu_item_6_name: "Traditionell Crème brûlée",

                gallery_h2: "Atmosfär från restaurangen",
                gallery_item_1: "Soppanrättning", // Päivitetyt ALT-tekstit
                gallery_item_2: "Hangö hamn",
                gallery_item_3: "Huvudrätt 1",
                gallery_item_4: "Huvudrätt 2",

                booking_h2: "Boka Ditt Bord",
                booking_p1: "Du får snabbast svar och de bästa platserna i Hangös sol genom att ringa direkt till vår restaurang. Välkommen att njuta av upplevelsen!",
                booking_p2_strong: "Adress",
                booking_p2_text: "Tegelbruksvägen 12, 10900 Hangö",
                booking_p3_strong: "Öppettider",
            }
        };

        const menuPrices = {
            1: "14 €", 2: "12 €", 3: "28 €",
            4: "25 €", 5: "22 €", 6: "9 €"
        };

        // Apufunktio aukioloaikojen muotoiluun (Grid-asettelu)
        function formatHours(hoursString) {
            const days = hoursString.split(', ');
            let html = '<div class="hours-grid">';
            days.forEach(day => {
                const parts = day.split(': ');
                if (parts.length === 2) {
                    html += `<p><strong>${parts[0]}</strong> ${parts[1]}</p>`;
                } else if (parts.length === 1) {
                    const [dayName, status] = day.split(': ');
                    html += `<p><strong>${dayName}</strong> ${status || ''}</p>`;
                }
            });
            html += '</div>';
            return html;
        }

        function loadContent(lang) {
            const data = content[lang];
            const container = document.getElementById('content-container');
            const hoursHtml = formatHours(data.home_hours_full);

            document.documentElement.lang = lang;

            container.innerHTML = `
                <section id="home" class="page-section is-visible">
                    <h1 class="logo">${data.home_h1}</h1>
                    <p class="description">${data.home_desc}</p>

                    <div class="contact-info">
                        <p><strong>${lang === 'fi' ? 'Osoite:' : 'Adress:'}</strong> ${data.home_address}</p>
                        <p><strong>${lang === 'fi' ? 'Aukioloajat:' : 'Öppettider:'}</strong> ${data.home_hours}</p>
                    </div>

                    <a href="#booking" class="reserve-button">${data.home_button}</a>
                </section>

                <section id="menu" class="page-section">
                    <h2>${data.menu_h2}</h2>
                    <div class="menu-list">
                        <h3>${data.menu_h3_1}</h3>
                        <div class="menu-item"><span class="menu-item-name">${data.menu_item_1_name}</span><span class="menu-item-price">${menuPrices[1]}</span></div>
                        <div class="menu-item"><span class="menu-item-name">${data.menu_item_2_name}</span><span class="menu-item-price">${menuPrices[2]}</span></div>

                        <h3>${data.menu_h3_2}</h3>
                        <div class="menu-item"><span class="menu-item-name">${data.menu_item_3_name}</span><span class="menu-item-price">${menuPrices[3]}</span></div>
                        <div class="menu-item"><span class="menu-item-name">${data.menu_item_4_name}</span><span class="menu-item-price">${menuPrices[4]}</span></div>
                        <div class="menu-item"><span class="menu-item-name">${data.menu_item_5_name}</span><span class="menu-item-price">${menuPrices[5]}</span></div>

                        <h3>${data.menu_h3_3}</h3>
                        <div class="menu-item"><span class="menu-item-name">${data.menu_item_6_name}</span><span class="menu-item-price">${menuPrices[6]}</span></div>
                    </div>
                </section>

                <section id="gallery" class="page-section">
                    <h2>${data.gallery_h2}</h2>
                    <div class="gallery-grid">
                        <div class="gallery-item">
                            <img src="keitto.jpg" alt="${data.gallery_item_1}" class="gallery-img">
                        </div>
                        <div class="gallery-item">
                            <img src="pasta.jpg" alt="${data.gallery_item_2}" class="gallery-img">
                        </div>
                        <div class="gallery-item">
                            <img src="ruokakuva1.jpg" alt="${data.gallery_item_3}" class="gallery-img">
                        </div>
                        <div class="gallery-item">
                            <img src="ruokakuva2.jpg" alt="${data.gallery_item_4}" class="gallery-img">
                        </div>
                    </div>
                </section>
                <section id="booking" class="page-section">
                    <div class="booking-details">
                        <h2>${data.booking_h2}</h2>
                        <p>${data.booking_p1}</p>

                        <a href="tel:+358404840091" class="phone-link">040 484 0091</a>

                        <p style="margin-top: 2rem; font-weight: 700;">
                            <strong>${data.booking_p2_strong}:</strong> ${data.booking_p2_text}
                        </p>

                        <h3 style="margin-top: 3rem; color: var(--accent-gold); font-family: var(--font-logo); font-size: 2rem;">
                            ${data.booking_p3_strong}
                        </h3>
                        ${hoursHtml}

                    </div>
                </section>
            `;
            initScrollReveal();
            updateLangSelector(lang);
        }

        function initScrollReveal() {
            const sections = document.querySelectorAll('.page-section:not(#home)');
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            sections.forEach(section => {
                observer.observe(section);
            });
        }

        function updateLangSelector(lang) {
            document.querySelectorAll('.lang-selector a').forEach(a => {
                a.classList.remove('active');
            });
            document.querySelector(`.lang-selector a[data-lang="${lang}"]`).classList.add('active');
            localStorage.setItem('userLang', lang);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const header = document.getElementById('main-header');
            const defaultLang = localStorage.getItem('userLang') || 'fi';

            loadContent(defaultLang);

            document.querySelectorAll('.lang-selector a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const newLang = this.getAttribute('data-lang');
                    loadContent(newLang);
                });
            });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        });
    </script>
</body>
</html>
